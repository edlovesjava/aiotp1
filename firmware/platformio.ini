; aiotp1 firmware. Envs: voice_s3 (ESP32-S3 voice controller), actuator_led
; (classic ESP32 actuator), native (host unit tests with Unity).
;
; src_dir points at the parent of the per-node directories; each board env
; selects its own node with build_src_filter. Tests under test/ are excluded
; from firmware builds by PlatformIO automatically.

[platformio]
default_envs = voice_s3, actuator_led
src_dir = nodes
include_dir = include
lib_dir = lib
test_dir = test

[env]
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.0

; ESP32-S3 DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM). Board and pins
; to be confirmed, see docs/product-spec.md section 7.
[env:voice_s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<voice_s3/>

; Classic ESP32 actuator node, onboard LED first.
[env:actuator_led]
platform = espressif32
framework = arduino
board = esp32dev
build_src_filter = +<actuator_led/>

; Host unit tests. No framework, no hardware libraries. Not in default_envs:
; `pio run` builds firmware only; `pio test -e native` builds the tests
; (test_build_src is off, so node sources are never compiled for the host).
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = -<*>
lib_deps =
test_framework = unity
